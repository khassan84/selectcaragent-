spring:
  application:
    name: selectcaragent
  main:
    web-application-type: servlet
    banner-mode: "off"
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.1}
          temperature: 0.7

selectcar:
  data-dir: ${SELECTCAR_DATA_DIR:data}
  sources-file: website.json
  processed-file: processed.json
  article-list-file: articlelist.json
  articles-file: articles.json
  expert-reviews-file: expertreviews.json
  expert-review-sample-file: expertreviewsample.json
  expert-reviews-dir: expertreviews
  lookback-days: 7
  max-links-per-source: 25
  min-article-words: 1200
  min-review-words: 1000
  http-timeout-ms: 15000
  run-pipeline: true
  review-status: reviewStatus.json
logging:
  level:
    com.selectcar.agent: INFO
